name: Build and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: overlay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: win32-x64 }
          - { os: windows-2022, target: win32-ia32 }
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: macos-15, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb openbox libgtk-3-0 libnss3 libasound2 libgbm1 dbus-x11
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:native -- ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a sh -c 'openbox & npm run test:smoke -- --target=${{ matrix.target }}'
      - if: runner.os != 'Linux'
        run: npm run test:smoke -- --target=${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- sh -c 'openbox & npm run test:native -- --target=${{ matrix.target }}'
      - if: runner.os != 'Linux'
        run: npm run test:native -- --target=${{ matrix.target }}
      - run: npm run package -- ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: overlay-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: overlay-*
          path: release
          merge-multiple: true
      - run: node scripts/manifest.cjs
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*.zip
      - name: Publish immutable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.cjs
